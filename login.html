<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Créer un compte</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <div class="form-container">
    <h2>CREATE A NEW ACCOUNT</h2>
    <form id="registrationForm">
      <label for="nom">Nom</label>
      <input type="text" id="nom" name="nom" required />

      <label for="prenom">Prénom</label>
      <input type="text" id="prenom" name="prenom" required />

      <label>Date de naissance</label>
      <div class="birthdate">
        <input type="number" id="jour" name="jour" placeholder="jj" min="1" max="31" required />
        <input type="number" id="mois" name="mois" placeholder="mm" min="1" max="12" required />
        <input type="number" id="annee" name="annee" placeholder="année" min="1900" max="2025" required />
      </div>

      <label for="genre">Genre</label>
      <select id="genre" name="genre" required>
        <option value="">M/F</option>
        <option value="M">M</option>
        <option value="F">F</option>
      </select>

      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" placeholder="username@gmail.com" required />

      <label for="motdepasse">Mot de passe</label>
      <input type="password" id="motdepasse" name="motdepasse" required />

      <button type="submit">Créer un compte</button>
    </form>
  </div>
  <script src="login.js"></script>
</body>
</html>
