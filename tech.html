<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Espace Technicien</title>
  <style type="text/css">
    body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: linear-gradient(to right, #1c1c1c, #2c2c2c);
  color: #fff;
}

header {
  background-color: #111;
  text-align: center;
  padding: 1rem;
  border-bottom: 3px solid #f1c40f;
}

h1 {
  color: #f1c40f;
  margin: 0;
}

main {
  padding: 2rem;
  max-width: 900px;
  margin: auto;
}

.card {
  background-color: #222;
  padding: 1rem;
  border-radius: 15px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.3);
  margin-bottom: 1rem;
}

button {
  background-color: #f1c40f;
  color: #000;
  border: none;
  padding: 0.5rem 1rem;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background-color: #d4ac0d;
}

input, textarea, select {
  width: 100%;
  margin-bottom: 1rem;
  padding: 0.5rem;
  border-radius: 6px;
  border: none;
  background-color: #333;
  color: white;
}

.status {
  padding: 0.3rem 0.6rem;
  border-radius: 6px;
  font-size: 0.8rem;
}

.status.EnCours {
  background-color: orange;
  color: black;
}

.status.Terminee {
  background-color: green;
  color: white;
}

.login {
  background-color: #2a2a2a;
  padding: 2rem;
  border-radius: 15px;
  max-width: 400px;
  margin: auto;
  box-shadow: 0 0 20px rgba(255, 255, 0, 0.2);
}

.filters, .add-form {
  margin-bottom: 2rem;
}

  </style>
</head>
<body>
  <header>
    <h1>Espace Technicien</h1>
  </header>
  <main id="mainContent">
    <!-- Contenu injecté par JavaScript -->
  </main>

  <script >
    let tasks = [
  { id: 1, titre: "Test micros", description: "Salle A", statut: "EnCours" },
  { id: 2, titre: "Vérifier câblage", description: "Salle B", statut: "Terminee" }
];
let currentFilter = "Toutes";

function renderDashboard() {
  const container = document.getElementById('mainContent');
  container.innerHTML = `
    <div class="filters">
      <label>Filtrer les demandes :</label>
      <select onchange="filterTasks(this.value)">
        <option value="Toutes">Toutes</option>
        <option value="EnCours">En cours</option>
        <option value="Terminee">Terminée</option>
      </select>
    </div>
    <div id="taskContainer"></div>
    <div class="add-form">
      <h2>Ajouter une demande</h2>
      <input id="newTitre" placeholder="Titre" />
      <textarea id="newDesc" placeholder="Description"></textarea>
      <button onclick="addTask()">Ajouter</button>
    </div>
    <div class="card">
      <h2>Historique des demandes</h2>
      <ul id="historyList"></ul>
    </div>
  `;
  renderTasks();
  renderHistory();
}

function renderTasks() {
  const taskContainer = document.getElementById('taskContainer');
  taskContainer.innerHTML = "";
  tasks.filter(t => currentFilter === "Toutes" || t.statut === currentFilter)
    .forEach(task => {
      taskContainer.innerHTML += `
        <div class="card">
          <h3>${task.titre}</h3>
          <span class="status ${task.statut}">${task.statut === "EnCours" ? "En cours" : "Terminée"}</span>
          <p>${task.description}</p>
          ${task.statut === "EnCours" ? `<button onclick="markAsDone(${task.id})">Marquer comme terminée</button>` : ""}
        </div>
      `;
    });
}

function renderHistory() {
  const history = document.getElementById('historyList');
  history.innerHTML = "";
  tasks.forEach(task => {
    history.innerHTML += `<li>${task.titre} - ${task.description} [${task.statut}]</li>`;
  });
}

function filterTasks(value) {
  currentFilter = value;
  renderTasks();
}

function markAsDone(id) {
  const task = tasks.find(t => t.id === id);
  if (task) {
    task.statut = "Terminee";
    renderTasks();
    renderHistory();
  }
}

function addTask() {
  const titre = document.getElementById('newTitre').value.trim();
  const desc = document.getElementById('newDesc').value.trim();
  if (!titre || !desc) {
    alert("Remplis tous les champs !");
    return;
  }
  const newTask = { id: tasks.length + 1, titre, description: desc, statut: "EnCours" };
  tasks.push(newTask);
  showNotification(`Nouvelle demande assignée : ${titre}`);
  document.getElementById('newTitre').value = "";
  document.getElementById('newDesc').value = "";
  renderTasks();
  renderHistory();
}

function showNotification(message) {
  const notif = document.createElement("div");
  notif.textContent = message;
  notif.style.position = "fixed";
  notif.style.bottom = "20px";
  notif.style.right = "20px";
  notif.style.background = "#f1c40f";
  notif.style.color = "#000";
  notif.style.padding = "10px 20px";
  notif.style.borderRadius = "8px";
  notif.style.boxShadow = "0 0 10px rgba(0,0,0,0.2)";
  document.body.appendChild(notif);
  setTimeout(() => notif.remove(), 4000);
}

// Charger directement le tableau de bord au lieu de la page de login
renderDashboard();
  </script>
</body>
</html>
