<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="container">
        <div class="login-box">
            <img src="../images/logo.png" alt="Logo" class="logo">
            <h1 class="title">Login</h1>
            <form>
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="username@gmail.com" required>
                
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Password" required>
                
                <a href="#" class="forgot-password">Forgot Password?</a>
                
                <button type="submit" class="btn">Sign in</button>
            </form>
            <p class="register-link">Don’t have an account yet? <a href="#">Register for free</a></p>
            <p class="continue-with">or continue with</p>
            <div class="social-login">
                <button class="social-btn google">
                    <img src="../images/google.png" alt="google">
                </button>
                <button class="social-btn github">
                    <img src="../images/github.png" alt="github">
                </button>
                <button class="social-btn facebook">
                    <img src="../images/github.png" alt="facebook">
                </button>
            </div>

        </div>
    </div>
</body>
</html>
