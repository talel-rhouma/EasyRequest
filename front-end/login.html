<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <div class="container">
    <div class="login-box">
      <img src="../images/logo.png" alt="Logo" class="logo" />
      <h1 class="title">Login</h1>
      <form>
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="username@gmail.com" required />

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Password" required />

        <a href="#" class="forgot-password">Forgot Password?</a>

        <button type="submit" class="btn">Sign in</button>
      </form>

      <p class="register-link">
        Don't have an account yet?
        <a href="signup.html">Register for free</a>
      </p>

      <p class="continue-with">or continue with</p>
      <div class="social-login">
        <button class="social-btn google"><img src="../images/google.png" alt="google" /></button>
        <button class="social-btn github"><img src="../images/github.png" alt="github" /></button>
        <button class="social-btn facebook"><img src="../images/fb.png" alt="facebook" /></button>
      </div>
    </div>

    <!-- Menu bar -->
    
  </div>
  <script>
    document.querySelector("form").addEventListener("submit", async function (e) {
      e.preventDefault();
  
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
  
      try {
        const response = await fetch("http://localhost:3000/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ email, password }),
        });
  
        const data = await response.json();
  
        if (response.ok) {
          alert("✅ " + data.message);
          console.log("User Info:", data.user);
          // Redirection based on role
          if (data.user && data.user.role === 'admin') {
            window.location.href = '../back-end/back.html';
          } else if (data.user && data.user.role === 'user') {
            window.location.href = 'home.html';
          } else if (data.redirectTo) {
            window.location.href = data.redirectTo;
          }
        } else {
          alert("❌ " + data.message);
        }
      } catch (error) {
        alert("⚠️ Something went wrong");
        console.error(error);
      }
    });
  </script>
  
</body>
</html>
